name: Build Spax Android SMS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android-sms-app/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/android-sms-app.yml'
  pull_request:
    paths:
      - 'android-sms-app/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/android-sms-app.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & run regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run outreach & SMS regression tests
        run: >-
          node --test
          tests/spax-sms-companion.test.js
          tests/personalized-sms.test.js
          tests/outreach-new-segments.test.js
          tests/outreach-sms-length.test.js
          tests/outreach-welcome-template.test.js
          tests/customer-purchase-order.test.js
          tests/import-purchase-order.test.js

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Cache persistent signing keystore (for seamless APK updates)
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.spax-keystore/spax-release.jks
          key: spax-sms-release-keystore-v1

      - name: Prepare APK signing keystore
        id: keystore
        env:
          SECRET_KS_B64: ${{ secrets.SPAX_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.SPAX_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SPAX_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.SPAX_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.spax-keystore
          KS_FILE="$HOME/.spax-keystore/spax-release.jks"
          if [ -n "$SECRET_KS_B64" ]; then
            echo "$SECRET_KS_B64" | base64 --decode > "$KS_FILE"
            echo "SPAX_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "SPAX_KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "SPAX_KEY_ALIAS=${SECRET_KEY_ALIAS:-spaxsms}" >> "$GITHUB_ENV"
            echo "SPAX_KEY_PASSWORD=${SECRET_KEY_PASS:-$SECRET_KS_PASS}" >> "$GITHUB_ENV"
          else
            if [ ! -f "$KS_FILE" ]; then
              keytool -genkeypair -v \
                -keystore "$KS_FILE" \
                -alias spaxsms \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass spaxbutchery2026 \
                -keypass spaxbutchery2026 \
                -dname "CN=SpaxButchery SMS, OU=Outreach, O=SpaxButchery, L=Nairobi, C=KE"
            fi
            echo "SPAX_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "SPAX_KEYSTORE_PASSWORD=spaxbutchery2026" >> "$GITHUB_ENV"
            echo "SPAX_KEY_ALIAS=spaxsms" >> "$GITHUB_ENV"
            echo "SPAX_KEY_PASSWORD=spaxbutchery2026" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed Spax SMS Companion APK
        run: |
          gradle -p android-sms-app assembleRelease --no-daemon
          cp android-sms-app/app/build/outputs/apk/release/app-release.apk spax-sms-companion.apk
          ls -lh spax-sms-companion.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spax-sms-companion-apk
          path: spax-sms-companion.apk
          if-no-files-found: error
          retention-days: 90
