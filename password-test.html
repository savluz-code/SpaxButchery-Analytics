<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encrypted PDF Statement Test — SpaxButchery</title>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';</script>
<style>
:root{--bg:#0f1419;--card:#1a2129;--card2:#212b35;--border:#2c3945;--red:#e63946;--green:#2ec4b6;--blue:#4cc9f0;--text:#e8edf2;--muted:#8b9aa7}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);margin:0;padding:24px;max-width:900px;margin:0 auto}
h1{font-size:1.3rem}.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--green)}
input,button{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:.9rem}
button{background:var(--green);color:#04292a;font-weight:600;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
#result{white-space:pre-wrap;font-family:monospace;font-size:.85rem;line-height:1.6;background:var(--card2);border-radius:8px;padding:14px;margin-top:14px;min-height:40px}
.ok{color:var(--green)}.bad{color:var(--red)}.mut{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:12px}
th{text-align:left;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:2px solid var(--border);font-size:.7rem;text-transform:uppercase}
td{padding:7px 8px;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(255,255,255,.03)}
pre{white-space:pre-wrap;font-family:monospace;font-size:.78rem;background:#0a0e13;border:1px solid var(--border);border-radius:8px;padding:12px;max-height:400px;overflow:auto;margin-top:12px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--blue);font-size:.82rem}
</style>
</head>
<body>
<h1>🔓 Encrypted PDF Statement Test</h1>
<div class="sub">Mirrors <b>SpaxButchery index.html</b> exactly — pdfjs-dist <b>3.11.174</b> unlock + the app's real <code>parseMpesaText()</code> parser (verbatim).</div>

<div class="card">
  <div class="drop" id="drop">
    <div style="font-size:2rem">📄</div>
    <div><b>Drop the M-Pesa statement PDF here</b> or click to browse</div>
    <input type="file" id="file" accept=".pdf" style="display:none">
  </div>
  <div class="row">
    <label class="mut" for="pw">Password</label>
    <input type="text" id="pw" value="214502" style="flex:1;min-width:140px">
    <button id="tryBtn">🔓 Unlock &amp; Parse</button>
  </div>
  <div id="result">Waiting for a file…</div>
</div>

<div class="card" id="txCard" style="display:none">
  <h3 style="margin:0 0 8px">📝 Parsed transactions (real app parser)</h3>
  <div id="txTableWrap"></div>
  <details>
    <summary>Show raw extracted text</summary>
    <pre id="txDump"></pre>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
let fileBuf = null, fileName = '';

$('drop').onclick = () => $('file').click();
$('drop').ondragover = e => { e.preventDefault(); $('drop').style.borderColor='var(--green)'; };
$('drop').ondragleave = () => $('drop').style.borderColor='';
$('drop').ondrop = e => { e.preventDefault(); $('drop').style.borderColor=''; loadFile(e.dataTransfer.files[0]); };
$('file').onchange = e => { loadFile(e.target.files[0]); };

async function loadFile(f){
  if(!f) return;
  fileName = f.name;
  fileBuf = new Uint8Array(await f.arrayBuffer());
  $('result').innerHTML = `<span class="mut">Loaded <b>${f.name}</b> (${f.size} bytes). Click “Unlock &amp; Parse”.</span>`;
}

async function extractText(doc){
  const lines = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const c = await page.getTextContent();
    const items = c.items.map(i=>String(i.str||'').trim()).filter(Boolean);
    lines.push(items.join(' '));
  }
  return lines.join('\n');
}

/* ══════════ REAL APP PARSER — copied VERBATIM from index.html ══════════ */

function parseAmount(value) {
  if (value === null || value === undefined) return 0;
  return Number(String(value).replace(/[^\d.-]/g, "") || 0);
}

function parseDate(value) {
  if (!value) return "";
  if (typeof value === "number") {
    if (typeof XLSX !== 'undefined' && XLSX.SSF && XLSX.SSF.parse_date_code) {
      const d = XLSX.SSF.parse_date_code(value);
      if (d) return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`;
    }
    return "";
  }
  const raw = String(value).trim();
  const iso = raw.match(/(\d{4}-\d{2}-\d{2})/);
  if (iso) return iso[1];
  const iso2 = raw.match(/(\d{4}\/\d{2}\/\d{2})/);
  if (iso2) return iso2[1].replace(/\//g, '-');
  const dmy = raw.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if (dmy) {
    const day = String(dmy[1]).padStart(2, '0');
    const month = String(dmy[2]).padStart(2, '0');
    const year = dmy[3];
    if (Number(month) <= 12 && Number(day) <= 31) return `${year}-${month}-${day}`;
  }
  const d = new Date(raw);
  if (!isNaN(d)) return d.toISOString().slice(0, 10);
  return "";
}

function toTitleCase(str) {
  return String(str || "").toLowerCase().split(/\s+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

function normalizeContact(contact) {
  let c = String(contact || "").trim();
  if (!c || c.toLowerCase().includes("missing")) return "";
  c = c.replace(/\s+/g, "");
  if (c.includes("***")) {
    if (c.startsWith("254")) return "0" + c.slice(3);
    return c;
  }
  c = c.replace(/[^\d+]/g, "");
  if (c.startsWith("+254")) c = "0" + c.slice(4);
  if (c.startsWith("254")) c = "0" + c.slice(3);
  return c;
}

function normalizeMpesaText(text) {
  return String(text || "")
    .replace(/\r/g, "\n")
    .replace(/\u00A0/g, " ")
    .replace(/[|]/g, " ")
    .replace(/Compieted|Cornpleted|Compleled/gi, "Completed")
    .replace(/Payrnent/gi, "Payment")
    .replace(/Merchanl|Mcrchant|Mercliant/gi, "Merchant")
    .replace(/Custorner/gi, "Customer")
    .replace(/O\.00/g, "0.00")
    .replace(/0\.O0/g, "0.00")
    .replace(/\b([A-Z0-9]{8,10})\s+([A-Z0-9]{1,2})\b(?=\s+\d{4}[-\/]\d{2}[-\/]\d{2})/gi, "$1$2");
}

function cleanReceipt(r) {
  return String(r || "").replace(/\s+/g, "").replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0, 10);
}

function extractPerson(details) {
  const raw = String(details || "").replace(/\s+/g, " ").trim();
  const phoneMatch = raw.match(/(254\d{3}\*{3}\d{3}|0\d{3}\*{3}\d{3}|254\d{9}|0\d{9}|\+?254\d{9}|0[17]\d{8})/);
  const contact = phoneMatch ? normalizeContact(phoneMatch[1]) : "";
  let name = "";
  const fromMatch = raw.match(/(?:Merchant\s+Payment\s+from|Online\s+from|received\s+from|Small\s+Business\s+Pay\s+Merchant\s+from|Buy\s+Goods\s+from|Pay\s+Bill\s+from)\s+(.+?)(?:\s+-\s+|\s+Customer|\s+Merchant|\s+Payment|\s+OD|\s+Transfer|$)/i);
  if (fromMatch) {
    name = fromMatch[1].replace(phoneMatch ? phoneMatch[1] : "", "").trim();
  }
  if (!name) {
    const dash = raw.match(/-\s*([A-Za-z][A-Za-z\s.'’\-]+?)(?:\s+Customer|\s+Merchant|\s+Payment|\s+OD|\s+Transfer|\s+via|$)/i);
    if (dash) name = dash[1];
  }
  if (!name) {
    const generic = raw.match(/(?:from|received from)\s+([A-Za-z][A-Za-z\s.'’\-]+)/i);
    if (generic) {
      name = generic[1]
        .replace(phoneMatch ? phoneMatch[1] : "", "")
        .replace(/^\s*-\s*/, "")
        .replace(/\s+Customer.*$/i, "")
        .replace(/\s+Merchant.*$/i, "")
        .replace(/\s+Payment.*$/i, "")
        .trim();
    }
  }
  name = name.replace(/[^A-Za-z\s.'’\-]/g, " ").replace(/\s+/g, " ").trim();
  name = name.replace(/\s+\bvia\b[\s\S]*$/i, " ").replace(/^[-–—\s]+|[-–—\s]+$/g, "").replace(/\s+/g, " ").trim();
  if (!name) name = contact || "M-Pesa Customer";
  return { name: toTitleCase(name), contact };
}

function isMerchant(name) {
  if (!name) return false;
  const n = String(name).toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!n) return false;
  const hasSimon = n.split(/\s+/).some(w => w === 'simon' || w === 'simo');
  return hasSimon && n.includes('musyoka');
}

function isIncomingMpesaDetails(details) {
  return /merchant\s+payment|pay\s+merchant|buy\s+goods|received\s+from|payment\s+received|funds\s+received|pay\s+bill[\s\S]*?\bfrom\b/i.test(String(details || ''));
}

function parseMpesaText(raw, sourceLabel) {
  sourceLabel = sourceLabel || "M-Pesa PDF/OCR";
  const text = normalizeMpesaText(raw).replace(/\n/g, " ").replace(/\s+/g, " ").trim();
  const txs = [];
  const seenKeys = new Set();

  const regex = /\b([A-Z0-9]{8,11})\b\s+(\d{4}[-\/]\d{2}[-\/]\d{2})\s+(\d{2}:\d{2}:\d{2})\s+([\s\S]*?)\bCompleted\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/gi;
  let m;
  while ((m = regex.exec(text)) !== null) {
    const receipt = cleanReceipt(m[1]);
    const date = parseDate(m[2]);
    const time = m[3];
    let details = m[4].trim();
    const amount = parseAmount(m[5]);
    if (!amount || amount <= 0) continue;
    if (!/from|received|pay\s+bill|buy\s+goods/i.test(details)) continue;
    const person = extractPerson(details);
    if (isMerchant(person.name) || isMerchant(details)) continue;
    const key = receipt + '|' + date + '|' + time;
    if (seenKeys.has(key)) continue;
    seenKeys.add(key);
    txs.push({ receipt, date, time, name: person.name, contact: person.contact, amount, details, source: sourceLabel });
  }

  const regex2 = /\b([A-Z0-9]{8,11})\s*(\d{4}[-\/]\d{2}[-\/]\d{2})\s+(\d{2}:\d{2}:\d{2})\s+([\s\S]*?)\bCompleted\s+((?:[-–—]\s*|[\d,]+\.\d{2}\s*){2,4})/gi;
  while ((m = regex2.exec(text)) !== null) {
    const cells = m[5].trim().split(/\s+/).filter(Boolean);
    if (cells[0] === '-' || cells[0] === '–' || cells[0] === '—') continue;
    const amounts = cells.filter(c => /\d/.test(c));
    if (amounts.length < 2) continue;
    const amount = parseAmount(amounts[0]);
    if (!amount || amount <= 0) continue;
    const details = m[4].trim();
    if (!isIncomingMpesaDetails(details)) continue;
    const person = extractPerson(details);
    if (isMerchant(person.name) || isMerchant(details)) continue;
    const receipt = cleanReceipt(m[1]);
    const date = parseDate(m[2]);
    const time = m[3];
    const key = receipt + '|' + date + '|' + time;
    if (seenKeys.has(key)) continue;
    seenKeys.add(key);
    txs.push({ receipt, date, time, name: person.name, contact: person.contact, amount, details, source: sourceLabel });
  }

  const lines = raw.split(/\n/);
  for (const line of lines) {
    const cleanLine = line.replace(/\s+/g, ' ').trim();
    if (cleanLine.length > 500) continue;
    const fallback = /\b([A-Z0-9]{8,11})\s*(\d{4}[-\/]\d{2}[-\/]\d{2})\s+(\d{2}:\d{2}:\d{2})/i;
    const fm = cleanLine.match(fallback);
    if (!fm) continue;
    const receipt = cleanReceipt(fm[1]);
    const date = parseDate(fm[2]);
    const time = fm[3];
    const afterStatus = cleanLine.split(/Completed/i)[1];
    if (!afterStatus) continue;
    if (/^\s*[-–—]/.test(afterStatus)) continue;
    const amountMatches = afterStatus.match(/[\d,]+\.\d{2}/g);
    if (!amountMatches || amountMatches.length < 2) continue;
    const strictWording = amountMatches.length < 3;
    const amount = parseAmount(amountMatches[0]);
    if (!(amount > 0)) continue;
    const key = receipt + '|' + date + '|' + time;
    if (seenKeys.has(key)) continue;
    seenKeys.add(key);
    const details = cleanLine.split(/Completed/i)[0].replace(fm[1], '').replace(fm[2], '').replace(fm[3], '').replace(/\s+/g, ' ').trim();
    if (!(strictWording ? isIncomingMpesaDetails(details) : /from|received|pay\s+bill|buy\s+goods/i.test(details))) continue;
    const person = extractPerson(details || cleanLine);
    if (isMerchant(person.name) || isMerchant(details) || isMerchant(cleanLine)) continue;
    txs.push({ receipt, date, time, name: person.name || 'M-Pesa Customer', contact: person.contact, amount, details: details || cleanLine, source: sourceLabel + " (fallback)" });
  }

  const completedCount = (text.match(/completed/gi) || []).length;
  txs.possibleMissed = Math.max(0, completedCount - txs.length);
  return txs;
}

/* ══════════ /REAL APP PARSER ══════════ */

const kes = n => 'KES ' + Number(n||0).toLocaleString();

$('tryBtn').onclick = async () => {
  if(!fileBuf){ $('result').innerHTML='<span class="bad">Drop a PDF first.</span>'; return; }
  const pw = $('pw').value;
  $('result').innerHTML = `<span class="mut">Trying password “${pw}”…</span>`;
  try {
    const doc = await pdfjsLib.getDocument({ data: fileBuf, password: pw }).promise;
    const text = await extractText(doc);
    const txs = parseMpesaText(text, 'M-Pesa PDF');
    $('result').innerHTML =
      `<span class="ok">✅ UNLOCKED — “${pw}” is the correct password.</span>\n` +
      `<span class="mut">${doc.numPages} page(s) · ${text.length} chars · <b>${txs.length} transaction(s)</b> parsed by the real app parser${txs.possibleMissed ? ' · ⚠️ ~' + txs.possibleMissed + ' “Completed” row(s) not captured' : ''}</span>`;

    $('txCard').style.display = 'block';
    $('txDump').textContent = text;

    if (!txs.length) {
      $('txTableWrap').innerHTML = `<div class="mut" style="margin-top:12px">No incoming transaction rows matched. See raw text below to diagnose.</div>`;
    } else {
      $('txTableWrap').innerHTML = `<table>
        <thead><tr><th>#</th><th>Receipt</th><th>Name</th><th>Phone</th><th>Amount</th><th>Date</th><th>Time</th></tr></thead>
        <tbody>${txs.map((t,i)=>`<tr><td>${i+1}</td><td>${t.receipt||'—'}</td><td>${t.name}</td><td>${t.contact||'—'}</td><td>${kes(t.amount)}</td><td>${t.date}</td><td>${t.time}</td></tr>`).join('')}</tbody>
      </table>`;
    }
  } catch (err) {
    $('txCard').style.display='none';
    if(err && err.name === 'PasswordException'){
      $('result').innerHTML = `<span class="bad">❌ Password “${pw}” was rejected</span> (${err.code===2?'incorrect password':'needs a password'}). Try again.`;
    } else {
      $('result').innerHTML = `<span class="bad">⚠️ Error:</span> ${err && err.message || err}`;
    }
  }
};
</script>
</body>
</html>
